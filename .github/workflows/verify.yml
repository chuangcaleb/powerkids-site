name: verify

on:
  pull_request:
  push:
    branches: [v4, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same loop documented in docs/workflows/verify-loop.md, run as
      # separate steps so a failure names itself in the job summary.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Every variable the Payload config reads must be present, because
          # the config is constructed while Next collects page data. They are
          # deliberately fake: the build must never reach a real service.
          #
          # Keep this list in sync with the EnvKey union in src/lib/env.ts. A
          # variable added there without a placeholder here fails CI at the
          # build step, which is the intended way to find out.
          DATABASE_URI: postgres://placeholder:placeholder@localhost:5432/placeholder
          PAYLOAD_SECRET: placeholder-secret-for-ci-builds-only
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          S3_BUCKET: placeholder
          S3_ACCESS_KEY_ID: placeholder
          S3_SECRET_ACCESS_KEY: placeholder
          S3_ENDPOINT: https://placeholder.r2.cloudflarestorage.com
          R2_PUBLIC_URL: https://placeholder.example.com
          PREVIEW_SECRET: placeholder-preview-secret
